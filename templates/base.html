<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SMA System{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark px-4 mb-4" style="background:var(--primary);box-shadow:0 3px 12px rgba(84,88,232,.25)">
  <a class="navbar-brand" href="{{ url_for('dashboard') }}">&#9724; SMA System</a>
  <div class="d-flex align-items-center gap-3">
    {% if user %}
      <span class="text-white small" id="sma-identity-badge" style="cursor:pointer" title="Click to set the name shown to other assessors">
        👤 <span id="sma-identity-name">…</span>
      </span>
      <a href="{{ url_for('new_assessment') }}" class="btn btn-warning btn-sm">+ New</a>
      <a href="{{ url_for('analysis') }}" class="btn btn-outline-light btn-sm">📊 Analysis</a>
      <a href="{{ url_for('admin_panel') }}" class="btn btn-outline-light btn-sm">⚙ Admin</a>
    {% endif %}
  </div>
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container-fluid px-4">
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible py-2 mb-2">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<div class="container-fluid px-4 pb-5">
  {% block content %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='chart.min.js') }}"></script>
<script>
// Browser-local identity for the "who else is here" presence panel — a courtesy
// label typed once per browser, not a login. Not authentication.
window.SMA_IDENTITY = (function () {
  let clientId = localStorage.getItem('sma_client_id');
  if (!clientId) {
    clientId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
             : 'c-' + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem('sma_client_id', clientId);
  }
  const listeners = [];
  function getName() { return localStorage.getItem('sma_display_name') || ''; }
  function setName(n) {
    localStorage.setItem('sma_display_name', (n || '').trim());
    paint(); listeners.forEach(f => { try { f(getName()); } catch (e) {} });
  }
  function paint() {
    const el = document.getElementById('sma-identity-name');
    if (el) el.textContent = getName() || 'set your name';
  }

  // Pick from the assessment's roster when the page exposes one (window.ASSESSORS), so the
  // name in the change log matches the name on the evidence boxes. Free text otherwise.
  function promptForName(existing) {
    const roster = Array.isArray(window.ASSESSORS) ? window.ASSESSORS : [];
    if (!roster.length) {
      const n = prompt('Your name (shown to other assessors while you work):', existing || '');
      if (n !== null) setName(n);
      return;
    }
    document.getElementById('sma-idmodal')?.remove();
    const wrap = document.createElement('div');
    wrap.id = 'sma-idmodal';
    wrap.className = 'modal fade';
    wrap.innerHTML = `<div class="modal-dialog modal-sm modal-dialog-centered"><div class="modal-content">
      <div class="modal-header py-2"><h6 class="modal-title mb-0">Who is working here?</h6></div>
      <div class="modal-body">
        <p class="small text-muted">Shown to the other assessors on this page and recorded next
           to your changes. Not a login &mdash; you can change it any time.</p>
        <div class="d-grid gap-1">
          ${roster.map(n => `<button type="button" class="btn btn-sm ${n === existing ? 'btn-primary' : 'btn-outline-primary'} sma-idpick" data-n="${n.replace(/"/g,'&quot;')}">${n}</button>`).join('')}
        </div>
        <input class="form-control form-control-sm mt-2" id="sma-idother" placeholder="or type another name"
               value="${roster.includes(existing) ? '' : (existing || '').replace(/"/g,'&quot;')}">
      </div>
      <div class="modal-footer py-1">
        <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" id="sma-idsave">Save</button>
      </div></div></div>`;
    document.body.appendChild(wrap);
    const m = new bootstrap.Modal(wrap);
    wrap.querySelectorAll('.sma-idpick').forEach(b =>
      b.addEventListener('click', () => { setName(b.dataset.n); m.hide(); }));
    wrap.querySelector('#sma-idsave').addEventListener('click', () => {
      const v = wrap.querySelector('#sma-idother').value.trim();
      if (v) setName(v);
      m.hide();
    });
    wrap.addEventListener('hidden.bs.modal', () => wrap.remove());
    m.show();
  }

  document.addEventListener('DOMContentLoaded', function () {
    paint();
    const badge = document.getElementById('sma-identity-badge');
    if (badge) badge.addEventListener('click', function () { promptForName(getName()); });
    if (!getName()) setTimeout(() => promptForName(''), 300);   // let the page set ASSESSORS first
  });
  return {
    clientId: clientId, getName: getName, setName: setName,
    ask: promptForName,
    onChange: function (f) { listeners.push(f); }
  };
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
